name: E2E

# The Playwright flows from SPEC section 9 against a production build and a
# freshly seeded database. Non-blocking by design (docs/PLAN.md D-17): a slow
# runner should never red-light the repository, and the report is uploaded
# either way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://techgear:techgear_dev@localhost:5432/techgear_erp?schema=public
  AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
  AUTH_URL: http://localhost:3000
  NODE_ENV: production

jobs:
  e2e:
    name: Playwright flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: techgear
          POSTGRES_PASSWORD: techgear_dev
          POSTGRES_DB: techgear_erp
          TZ: Asia/Manila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techgear -d techgear_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Dev dependencies are needed to build and to run the seed.
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
