services:
  postgres:
    image: postgres:17-alpine
    container_name: techgear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: techgear
      POSTGRES_PASSWORD: techgear_dev
      POSTGRES_DB: techgear_erp
      TZ: Asia/Manila
    ports:
      - "5432:5432"
    volumes:
      - techgear-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techgear -d techgear_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  techgear-pgdata:
